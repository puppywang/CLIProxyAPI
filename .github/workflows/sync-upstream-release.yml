name: sync-upstream-release

# Watches upstream (router-for-me/CLIProxyAPI) for new releases and, when one
# appears, rebases this fork's monitor-feature branch onto the new upstream
# tag, pushes a matching <upstream-tag>+monitor tag, and immediately runs
# goreleaser to publish binaries as a GitHub Release on the fork.
#
# Everything runs in one workflow on purpose: the default GITHUB_TOKEN does
# not trigger downstream workflows on push events, so splitting the rebase
# step and the release step into separate workflows would leave the tag
# push unhandled.
#
# Cadence: every 6 hours, plus a workflow_dispatch button for manual runs.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_REPO: router-for-me/CLIProxyAPI
  FEATURE_BRANCH: monitor-feature

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch tags
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream --tags --prune

      - name: Detect upstream latest release
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)
          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            echo "Could not resolve upstream latest release tag." >&2
            exit 1
          fi
          FORK_TAG="${UPSTREAM_TAG}+monitor"
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "fork_tag=$FORK_TAG"         >> "$GITHUB_OUTPUT"
          echo "Upstream latest release: $UPSTREAM_TAG"
          echo "Target fork tag:        $FORK_TAG"
          if git rev-parse "refs/tags/$FORK_TAG" >/dev/null 2>&1; then
            echo "Fork already has $FORK_TAG; nothing to do."
            echo "skip=true"  >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify upstream tag exists locally
        if: steps.detect.outputs.skip != 'true'
        run: |
          if ! git rev-parse "refs/tags/${{ steps.detect.outputs.upstream_tag }}" >/dev/null 2>&1; then
            echo "Upstream tag ${{ steps.detect.outputs.upstream_tag }} was not fetched." >&2
            exit 1
          fi

      - name: Attempt rebase onto upstream tag
        if: steps.detect.outputs.skip != 'true'
        id: rebase
        run: |
          set +e
          git rebase "${{ steps.detect.outputs.upstream_tag }}" 2>&1 | tee /tmp/rebase.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            git rebase --abort 2>/dev/null || true
            echo "rebase_failed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'REBASE_LOG<<REBASE_LOG_EOF'
              tail -200 /tmp/rebase.log
              echo 'REBASE_LOG_EOF'
            } >> "$GITHUB_ENV"
          else
            echo "rebase_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push rebased branch and tag
        if: steps.detect.outputs.skip != 'true' && steps.rebase.outputs.rebase_failed != 'true'
        run: |
          git push --force-with-lease origin "${FEATURE_BRANCH}"
          git tag "${{ steps.detect.outputs.fork_tag }}"
          git push origin "${{ steps.detect.outputs.fork_tag }}"
          echo "Pushed ${{ steps.detect.outputs.fork_tag }}; goreleaser step will publish binaries."

      - name: Refresh models catalog
        if: steps.detect.outputs.skip != 'true' && steps.rebase.outputs.rebase_failed != 'true'
        run: |
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json

      - uses: actions/setup-go@v5
        if: steps.detect.outputs.skip != 'true' && steps.rebase.outputs.rebase_failed != 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate build metadata
        if: steps.detect.outputs.skip != 'true' && steps.rebase.outputs.rebase_failed != 'true'
        env:
          FORK_TAG: ${{ steps.detect.outputs.fork_tag }}
        run: |
          echo "VERSION=${FORK_TAG}"                       >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)"      >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v6
        if: steps.detect.outputs.skip != 'true' && steps.rebase.outputs.rebase_failed != 'true'
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.detect.outputs.fork_tag }}
          VERSION:    ${{ env.VERSION }}
          COMMIT:     ${{ env.COMMIT }}
          BUILD_DATE: ${{ env.BUILD_DATE }}

      - name: Open conflict report issue
        if: steps.detect.outputs.skip != 'true' && steps.rebase.outputs.rebase_failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ steps.detect.outputs.upstream_tag }}
          FORK_TAG:     ${{ steps.detect.outputs.fork_tag }}
          RUN_URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Dedup: every 6h while the conflict persists, this step runs.
          # Without a guard we would file a new issue every cron, which
          # turns the inbox into spam and trains the operator to ignore
          # it — the exact opposite of what alerting is for. So: only
          # file when there is no open auto-sync issue mentioning this
          # upstream tag. When one already exists, append a comment with
          # the latest run URL instead — gives the operator a single
          # rolling thread per conflict.
          EXISTING_NUM=$(gh issue list \
            --label "auto-sync" \
            --state open \
            --search "in:title \"${UPSTREAM_TAG}\"" \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_NUM" ]; then
            echo "Open auto-sync issue #${EXISTING_NUM} already covers ${UPSTREAM_TAG}; appending run link."
            gh issue comment "$EXISTING_NUM" \
              --body "Still failing as of $(date -u +%Y-%m-%dT%H:%M:%SZ). Latest run: ${RUN_URL}" || true
            exit 0
          fi

          BODY_FILE=$(mktemp)
          {
            echo "Scheduled sync could not auto-rebase \`${FEATURE_BRANCH}\` onto upstream tag **${UPSTREAM_TAG}**."
            echo
            echo "Latest failing run: ${RUN_URL}"
            echo
            echo "## Rebase output"
            echo
            echo '```'
            printf '%s\n' "$REBASE_LOG"
            echo '```'
            echo
            echo "## Manual recovery"
            echo
            echo '```sh'
            echo "git fetch upstream --tags"
            echo "git checkout ${FEATURE_BRANCH}"
            echo "git rebase ${UPSTREAM_TAG}"
            echo "# resolve conflicts, then:"
            echo "git push --force-with-lease origin ${FEATURE_BRANCH}"
            echo "git tag ${FORK_TAG}"
            echo "git push origin ${FORK_TAG}"
            echo '```'
            echo
            echo "Pushing the \`${FORK_TAG}\` tag manually does NOT trigger an automatic release (GitHub blocks downstream workflow triggers from the default GITHUB_TOKEN). Re-run this workflow via 'Actions → sync-upstream-release → Run workflow' after the tag is in place; it will detect the new tag and proceed to the goreleaser step."
          } > "$BODY_FILE"
          gh issue create \
            --title "auto-sync: rebase conflict against ${UPSTREAM_TAG}" \
            --label "auto-sync" \
            --body-file "$BODY_FILE" || true
